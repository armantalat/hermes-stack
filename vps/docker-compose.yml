# ============================================================
#  Hermes Stack on a plain Linux VM (Oracle Always Free ARM, or any small server)
#  Same stack as the Hugging Face Space, but each service is its own
#  container and Caddy is the only thing exposed to the internet.
#
#    ./data/hermes      -> agent state   (mounted at /opt/data)
#    ./data/9router     -> router state  (mounted at /app/data)
#    ./data/omnirouter  -> keyless-models router state
#
#  Start:  bash bootstrap.sh      Stop:  docker compose down
# ============================================================
name: hermes-stack

services:
  # ---------------------------------------------------------- front door
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - router
      - hermes

  # ------------------------------------------------- 9Router (models + keys)
  router:
    image: decolua/9router:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      REQUIRE_API_KEY: "true"
      INITIAL_PASSWORD: "${ROUTER_INITIAL_PASSWORD}"
      # secure auth cookie only when Caddy terminates real HTTPS
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
    volumes:
      - ./data/9router:/app/data

  # ------------------------------------------- OmniRouter (keyless free models)
  omnirouter:
    build:
      context: ./omnirouter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PORT: "8080"
      ADMIN_PASSWORD: "${OMNI_ADMIN_PASSWORD}"
      AGENT_MODE: "1"
      ROUTER_KEY: "${OMNI_ROUTER_KEY}"
      AUTO_CHAIN: "${OMNI_AUTO_CHAIN:-}"
    volumes:
      - ./data/omnirouter:/data

  # ------------------------------------------------------------- the agent
  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["gateway", "run"]
    working_dir: /opt/hermes
    environment:
      HERMES_HOME: /opt/data
      HERMES_TIMEZONE: "${HERMES_TIMEZONE:-UTC}"
    # config.yaml + .env are rendered from this bundle's .env by bootstrap.sh
    env_file:
      - ./data/hermes/.env
    volumes:
      - ./data/hermes:/opt/data
    depends_on:
      - router
      - omnirouter

  # --------------------------------------- hourly backups -> HF dataset (free)
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      BACKUP_REPO: "${BACKUP_REPO}"
      HF_TOKEN: "${HF_TOKEN}"
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-3600}"
      BACKUP_FIRST_DELAY: "${BACKUP_FIRST_DELAY:-300}"
      BACKUP_KEEP_HOURS: "${BACKUP_KEEP_HOURS:-72}"
    volumes:
      - ./data/hermes:/opt/data:ro
